<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草料数据同步配置 v2.1</title>
<link rel="stylesheet" href="/assets/css/config.css">
</head>
<body>
<div class="container">
<div class="card">
<h2>🔌 数据源配置</h2>
<div class="field">
<label>数据源类型：草料官方数据库 (D1同步)</label>
<div class="info">直接读取已同步到 Cloudflare D1 的草料二维码 35 张表</div>
</div>
<div id="sourceMsg"></div>
</div>

<div class="card hidden" id="syncCard">
<h2>📊 选择同步表</h2>
<div class="field">
<div class="table-wrap">
<table>
<thead><tr><th class="checkbox-cell"><input type="checkbox" id="checkAll" checked></th><th>表名</th><th>说明</th></tr></thead>
<tbody id="tableListBody"></tbody>
</table>
</div>
</div>
<div class="field">
<label>同步周期（分钟）<span class="required">*</span></label>
<input type="number" id="intervalInput" value="60" min="5" max="1440">
<div class="info">最小 5 分钟，最大 1440 分钟（24 小时）</div>
</div>
<button class="btn" id="startSyncBtn">保存并开始同步</button>
<div id="syncMsg"></div>
</div>

<div class="card hidden" id="statusCard">
<h2>✅ 同步已配置</h2>
<div id="statusContent" style="font-size:14px;color:#1f2328;line-height:1.8"></div>
</div>
</div>

<div id="debugLog"></div>
<button id="debugToggle" onclick="document.getElementById('debugLog').classList.toggle('show')">调试</button>

<script>
(function() {
  var debugLog = document.getElementById('debugLog');
  function log(msg) {
    var time = new Date().toLocaleTimeString();
    debugLog.innerHTML += '[' + time + '] ' + msg + '\n';
    debugLog.scrollTop = debugLog.scrollHeight;
    console.log('[Connector]', msg);
  }
  
  log('页面加载完成');
  
  var prefixId = '';
  var invokeCount = 0;
  var resultMap = {};
  var handshakeStatus = 0;

  function generateId(prefix) {
    return prefix + '-' + Date.now() + '-' + (++invokeCount);
  }

  function sendMsg(msg) {
    log('SEND: ' + JSON.stringify(msg).substring(0, 200));
    window.parent.postMessage(msg, '*');
  }

  function handleHandshake(data) {
    log('收到握手响应: ' + JSON.stringify(data).substring(0, 200));
    prefixId = (data.payload && data.payload.prefixId) || '';
    handshakeStatus = 1;
    sendMsg({
      id: data.id,
      type: 'handshake',
      payload: { proactive: false, info: { isHandshakeSuccess: true } }
    });
  }

  function handleCallback(data) {
    log('收到回调: id=' + data.id + ' res=' + JSON.stringify(data.payload && data.payload.res).substring(0, 200));
    var cb = resultMap[data.id];
    if (cb) {
      cb(data.payload && data.payload.res);
      delete resultMap[data.id];
    } else {
      log('警告: 找不到回调 id=' + data.id);
    }
  }

  function handleMessage(event) {
    var data = event.data;
    if (!data || !data.type) return;
    log('RECV: type=' + data.type);
    if (data.type === 'callback') handleCallback(data);
    else if (data.type === 'handshake') handleHandshake(data);
  }

  function startHandshake() {
    log('开始握手...');
    var retryCount = 0;
    var maxRetries = 5;
    
    function sendHandshake() {
      sendMsg({
        id: generateId('handshake'),
        type: 'handshake',
        payload: { proactive: true }
      });
    }
    
    sendHandshake();
    
    var retryInterval = setInterval(function() {
      if (handshakeStatus === 1 || retryCount >= maxRetries) {
        clearInterval(retryInterval);
        if (handshakeStatus !== 1) {
          handshakeStatus = 2;
          log('握手超时失败');
        }
        return;
      }
      retryCount++;
      log('重试握手 (' + retryCount + '/' + maxRetries + ')');
      sendHandshake();
    }, 2000);
  }

  function invokeApi(key, params) {
    log('调用 API: ' + key);
    return new Promise(function(resolve, reject) {
      function doInvoke() {
        var id = generateId(prefixId + '-invoke');
        log('发送 invoke: ' + key + ' id=' + id);
        sendMsg({
          type: 'invoke',
          id: id,
          payload: { key: key, params: params, prefixId: prefixId }
        });
        resultMap[id] = resolve;
        setTimeout(function() {
          if (resultMap[id]) {
            delete resultMap[id];
            reject(new Error('API调用超时: ' + key));
          }
        }, 15000);
      }
      
      if (handshakeStatus === 1) {
        doInvoke();
      } else if (handshakeStatus === 0) {
        var checkCount = 0;
        var checkInterval = setInterval(function() {
          checkCount++;
          if (handshakeStatus === 1) {
            clearInterval(checkInterval);
            doInvoke();
          } else if (handshakeStatus === 2 || checkCount > 50) {
            clearInterval(checkInterval);
            reject(new Error('握手失败，无法调用API'));
          }
        }, 100);
      } else {
        reject(new Error('握手失败，无法调用API'));
      }
    });
  }

  window.addEventListener('message', handleMessage);
  startHandshake();
  log('SDK 初始化完成');

  var sourceMsg = document.getElementById('sourceMsg');
  var syncCard = document.getElementById('syncCard');
  var syncMsg = document.getElementById('syncMsg');
  var startSyncBtn = document.getElementById('startSyncBtn');

  sourceMsg.innerHTML = '<div class="info-msg"><span class="loading"></span>正在连接 D1 数据库...</div>';
  
  log('开始测试连接...');
  fetch('https://feishu.yingjideng.dpdns.org/api/test-connection', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        sourceMsg.innerHTML = '<div class="success">✓ ' + data.message + '（共 ' + data.tables.length + ' 张表）</div>';
        renderTableList(data.tables);
        syncCard.classList.remove('hidden');
        log('D1 连接成功，发现 ' + data.tables.length + ' 张表');
      } else {
        sourceMsg.innerHTML = '<div class="error">' + (data.message || '连接失败') + '</div>';
        log('D1 连接失败: ' + data.message);
      }
    })
    .catch(function(e) {
      sourceMsg.innerHTML = '<div class="error">请求失败: ' + e.message + '</div>';
      log('请求失败: ' + e.message);
    });

  var tableComments = {
    'base_auth_msg': '填表人信息表',
    'base_category': '目录/分类信息表',
    'base_codeinfo': '码的基本信息表（活码、模板子码）',
    'base_members': '成员信息表',
    'base_project': '项目信息表',
    'base_qrcode_templates': '二维码模板表',
    'base_table_data': '表单数据汇总表',
    'base_tables': '表单结构信息表',
    'base_task': '计划基本信息表',
    'code_state': '码的状态表',
    'code_state_log': '码的状态变更日志表',
    'code_tags': '码的分组表',
    'code_task_log': '计划执行情况表',
    'cycle_plan': '周期计划配置表',
    'cycle_task': '周期任务配置表',
    'cycle_task_entity_task': '周期任务与码关联表',
    'cycle_task_instance': '周期任务执行实例表',
    'record_audit_data': '记录审批工单表',
    'record_review_data': '后续动态数据表',
    'table_d16': '表单数据明细表（表单16）',
    'table_d19': '表单数据明细表（表单19）',
    'table_d22': '表单数据明细表（表单22）',
    'table_d23': '表单数据明细表（表单23）',
    'table_d24': '表单数据明细表（表单24）',
    'table_d27': '表单数据明细表（表单27）',
    'table_d29': '表单数据明细表（表单29）',
    'table_d3': '表单数据明细表（表单3）',
    'table_d30': '表单数据明细表（表单30）',
    'table_d32': '表单数据明细表（表单32）',
    'table_d34': '表单数据明细表（表单34）',
    'table_d6': '表单数据明细表（表单6）',
    'table_relation': '表单关联关系表',
    'template_codeinfo_d10': '批量模板子码信息表（模板10）',
    'template_codeinfo_d12': '批量模板子码信息表（模板12）',
    'template_codeinfo_d14': '批量模板子码信息表（模板14）',
    'template_codeinfo_d15': '批量模板子码信息表（模板15）',
    'template_codeinfo_d25': '批量模板子码信息表（模板25）',
    'template_codeinfo_d28': '批量模板子码信息表（模板28）'
  };

  function renderTableList(tables) {
    var tbody = document.getElementById('tableListBody');
    tbody.innerHTML = '';
    tables.forEach(function(t) {
      var comment = tableComments[t.name] || t.comment || '';
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="checkbox-cell"><input type="checkbox" class="table-checkbox" value="' + t.name + '" checked></td><td>' + t.name + '</td><td style="color:#646a73;font-size:12px">' + comment + '</td>';
      tbody.appendChild(tr);
    });
  }

  document.getElementById('checkAll').addEventListener('change', function() {
    var cbs = document.querySelectorAll('.table-checkbox');
    for (var i = 0; i < cbs.length; i++) { cbs[i].checked = this.checked; }
  });

  startSyncBtn.addEventListener('click', function() {
    var cbs = document.querySelectorAll('.table-checkbox:checked');
    var selectedTables = [];
    for (var i = 0; i < cbs.length; i++) { selectedTables.push(cbs[i].value); }
    var interval = parseInt(document.getElementById('intervalInput').value);
    
    if (selectedTables.length === 0) { syncMsg.innerHTML = '<div class="error">请至少选择一张表</div>'; return; }
    if (isNaN(interval) || interval < 5) { syncMsg.innerHTML = '<div class="error">同步周期不能小于 5 分钟</div>'; return; }
    
    var config = { sourceType: 'd1', tables: selectedTables, interval: interval };
    
    startSyncBtn.disabled = true;
    syncMsg.innerHTML = '<div class="info-msg"><span class="loading"></span>正在保存配置...</div>';
    
    log('开始保存配置，选表: ' + selectedTables.join(','));
    
    invokeApi('saveConfigAndGoNext', { datasourceConfig: JSON.stringify(config) })
      .then(function(res) {
        log('保存成功: ' + JSON.stringify(res));
        syncMsg.innerHTML = '<div class="success">✓ 配置已保存，正在同步数据...</div>';
      })
      .catch(function(e) {
        log('保存失败: ' + (e.message || e));
        startSyncBtn.disabled = false;
        syncMsg.innerHTML = '<div class="error">保存失败: ' + (e.message || e) + '</div>';
      });
  });
})();
</script>
</body>
</html>
